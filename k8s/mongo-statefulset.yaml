apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: bikeflow
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: bikeflow
spec:
  serviceName: mongo
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: bikeflow
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mongodb
      containers:
        - name: mongodb
          image: mongo:7.0.14
          imagePullPolicy: IfNotPresent
          args: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
          ports:
            - name: mongodb
              containerPort: 27017
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
        labels:
          app.kubernetes.io/name: mongodb
          app.kubernetes.io/part-of: bikeflow
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
